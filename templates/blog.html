{% extends "base.html" %}
{% block title %}Blog | Israel Belchi{% endblock %}
{% block content %}
<main>
    <div class="content-wrapper">
        <section class="profile-section">
            <div class="profile-img-container">
                <img src="/assets/portrait.png" alt="Fotografia de perfil d'Israel Belchi">
            </div>
            <a href="/" class="terminal-link back-link">[\←]</a>
        </section>
        <section class="bubble-section inner-section">
            <div class="blog-list">
                {% for page in section.pages | reverse %}
                <article class="blog-entry">
                    <time class="entry-date">{{ page.date | date(format="%Y·%m·%d") }}</time>
                    <a href="{{ page.permalink }}" class="entry-title terminal-link">{{ page.title }}</a>
                </article>
                {% endfor %}
            </div>
        </section>
    </div>
</main>
{% endblock %}
