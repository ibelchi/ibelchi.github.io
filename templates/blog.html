{% extends "base.html" %}
{% block title %}Blog | Israel Belchi{% endblock %}
{% block content %}
<main>
    <div class="content-wrapper">
        <a href="/" class="terminal-link back-link" aria-label="Torna a la portada">[\←]</a>
        <section class="bubble-section inner-section">
            <div class="blog-list">
                {% for page in section.pages %}
                <article class="blog-entry">
                    <time class="entry-date">{{ page.date | date(format="%Y·%m·%d") }}</time>
                    <a href="{{ page.permalink }}" class="entry-title terminal-link">{{ page.title }}</a>
                </article>
                {% endfor %}
            </div>
        </section>
    </div>
</main>
{% endblock %}
