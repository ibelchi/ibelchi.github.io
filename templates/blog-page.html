{% extends "base.html" %}
{% block title %}{{ page.title }} | Israel Belchi{% endblock %}
{% block content %}
<main>
    <div class="content-wrapper">
        <section class="profile-section">
            <div class="profile-img-container">
                <img src="/assets/portrait.png" alt="Fotografia de perfil d'Israel Belchi">
            </div>
            <a href="/blog/" class="terminal-link back-link">[\←]</a>
        </section>
        <section class="bubble-section inner-section blog-post">
            <h1 class="post-title">{{ page.title }}</h1>
            <time class="entry-date">{{ page.date | date(format="%Y·%m·%d") }}</time>
            <div class="post-content">
                {{ page.content | safe }}
            </div>
        </section>
    </div>
</main>
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imatge ampliada">
        <button class="lightbox-close terminal-link" id="lightbox-close">[\x]</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');

        // Selecciona les imatges de dins del contingut del post
        document.querySelectorAll('.post-content img').forEach(img => {
            img.style.cursor = 'pointer';
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', e => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
{% endblock %}
