<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docs | Israel Belchi</title>
    <meta name="description" content="Documents, presentacions i vídeos d'Israel Belchi.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="content-wrapper">

            <section class="profile-section">
                <div class="profile-img-container">
                    <img src="assets/portrait.png" alt="Fotografia de perfil d'Israel Belchi">
                </div>
            </section>

            <section class="bubble-section inner-section">
                <a href="index.html" class="terminal-link back-link">[\←]</a>

                <div class="inner-grid docs-grid">

                    <!--
                        VÍDEO DE YOUTUBE
                        Canvia:
                          data-embed  → l'ID del vídeo (la part darrere de watch?v=)
                          data-title  → títol visible
                        La miniatura es carrega automàticament des de YouTube.
                    -->
                    <div class="doc-item" data-type="video" data-embed="h4ooWn2pBOI&t">
                        <div class="doc-thumb video-thumb">
                            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg" alt="">
                            <span class="play-icon">▶</span>
                        </div>
                        <div class="doc-meta">
                            <span class="doc-title">Taiko No Tatsujin 太鼓の達人 Análisis de un fenómeno</span>
                            <span class="doc-actions">
                                <button class="terminal-link doc-view">[\↗]</button>
                            </span>
                        </div>
                    </div>

                    <!--
                        PDF
                        Canvia:
                          data-src    → ruta al fitxer PDF (ex: assets/docs/informe.pdf)
                          data-title  → nom curt visible
                        La miniatura és una icona genèrica; pots substituir-la per una captura del PDF.
                    -->
                    <div class="doc-item" data-type="pdf" data-src="assets/docs/exemple.pdf">
                        <div class="doc-thumb pdf-thumb">
                            <svg viewBox="0 0 48 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect x="1" y="1" width="46" height="58" rx="3" fill="var(--primary-container)" stroke="var(--border-color)"/>
                                <path d="M12 22h24M12 30h24M12 38h16" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round"/>
                                <text x="24" y="14" text-anchor="middle" font-family="var(--font-mono)" font-size="7" fill="var(--accent-color)" font-weight="700">PDF</text>
                            </svg>
                        </div>
                        <div class="doc-meta">
                            <span class="doc-title">exemple.pdf</span>
                            <span class="doc-actions">
                                <button class="terminal-link doc-view">[\↗]</button>
                                <a class="terminal-link" href="assets/docs/exemple.pdf" download>[\↓]</a>
                            </span>
                        </div>
                    </div>

                    <!--
                        PRESENTACIÓ (PDF exportat des de Keynote / PowerPoint / Canva)
                        Funciona igual que el PDF però amb icona diferent.
                        Si uses Google Slides, canvia data-type="slides" i data-src per l'URL embed de Slides.
                    -->
                    <div class="doc-item" data-type="pdf" data-src="assets/docs/presentacio.pdf">
                        <div class="doc-thumb pdf-thumb">
                            <svg viewBox="0 0 48 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect x="1" y="1" width="46" height="58" rx="3" fill="var(--primary-container)" stroke="var(--border-color)"/>
                                <rect x="10" y="18" width="28" height="18" rx="1" fill="var(--primary-color)" opacity="0.2"/>
                                <path d="M10 42h28" stroke="var(--border-color)" stroke-width="1.5"/>
                                <text x="24" y="14" text-anchor="middle" font-family="var(--font-mono)" font-size="7" fill="var(--accent-color)" font-weight="700">PRES</text>
                            </svg>
                        </div>
                        <div class="doc-meta">
                            <span class="doc-title">presentacio.pdf</span>
                            <span class="doc-actions">
                                <button class="terminal-link doc-view">[\↗]</button>
                                <a class="terminal-link" href="assets/docs/presentacio.pdf" download>[\↓]</a>
                            </span>
                        </div>
                    </div>

                    <!-- Afegeix més ítems seguint els patrons anteriors -->

                </div>
            </section>

        </div>
    </main>

    <!-- Modal per a vídeos i PDFs -->
    <div class="lightbox" id="doc-modal" role="dialog" aria-modal="true" aria-label="Visualitzador de document">
        <button class="lightbox-close terminal-link" id="modal-close">[\x]</button>
        <div class="modal-content" id="modal-content"></div>
    </div>

    <footer>
        <p class="copyright">© 2026 Israel Belchi</p>
    </footer>

    <script>
        const modal = document.getElementById('doc-modal');
        const modalContent = document.getElementById('modal-content');
        const modalClose = document.getElementById('modal-close');

        function openModal(html) {
            modalContent.innerHTML = html;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            modalContent.innerHTML = '';
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.doc-view').forEach(btn => {
            btn.addEventListener('click', () => {
                const item = btn.closest('.doc-item');
                const type = item.dataset.type;

                if (type === 'video') {
                    const id = item.dataset.embed;
                    openModal(`<iframe
                        src="https://www.youtube.com/embed/${id}?autoplay=1"
                        allow="autoplay; encrypted-media"
                        allowfullscreen
                        title="Vídeo"
                        style="width:min(800px,90vw);aspect-ratio:16/9;border:none;border-radius:0.5rem;">
                    </iframe>`);
                } else if (type === 'pdf') {
                    const src = item.dataset.src;
                    openModal(`<iframe
                        src="${src}"
                        title="Document PDF"
                        style="width:min(800px,90vw);height:80vh;border:none;border-radius:0.5rem;background:#fff;">
                    </iframe>`);
                }
            });
        });

        // Obre el modal també en fer clic a la miniatura
        document.querySelectorAll('.doc-thumb').forEach(thumb => {
            thumb.style.cursor = 'pointer';
            thumb.addEventListener('click', () => {
                thumb.closest('.doc-item').querySelector('.doc-view').click();
            });
        });

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
