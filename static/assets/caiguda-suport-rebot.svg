eight="600" text-anchor="start">1 · El preu baixa</text><text x="625" y="191" font-size="17" fill="#49454e" font-weight="400" text-anchor="start">De 120 € cap a 95 €.</text><text x="625" y="280" font-size="19" fill="#2f7a4d" font-weight="600" text-anchor="start">2 · Possible suport</text><text x="625" y="306" font-size="17" fill="#49454e" font-weight="400" text-anchor="start">La caiguda frena als 95 €.</text><text x="625" y="390" font-size="19" fill="#2f7a4d" font-weight="600" text-anchor="start">3 · Primer rebot</text><text x="625" y="416" font-size="17" fill="#49454e" font-weight="400" text-anchor="start">El preu torna a pujar.</text></g></svg>