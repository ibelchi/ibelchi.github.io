<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Per després | Israel Belchi</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="./inbox.css?v=centred-3"><script src="./config.js" defer></script><script src="./inbox.js?v=quiet-status-6" defer></script></head>
<body><main class="inbox" aria-label="Safata de lectures"><p id="message" role="status" aria-live="polite"></p>
<form id="login" hidden><h2>Entra a la teva safata</h2><label for="email">Correu electrònic</label><input id="email" type="email" autocomplete="username" required><label for="password">Contrasenya</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form>
<section id="inbox" hidden><nav aria-label="Estat de les lectures"><button id="pending" aria-pressed="true">Pendents</button><button id="done" aria-pressed="false">Revisades</button><button id="reload">Actualitzar</button><button id="add">Afegir contingut</button></nav><div id="entries"></div></section>
<dialog id="reader"><button id="close" type="button" autofocus>Tancar</button><h2 id="read-title"></h2><p id="read-description"></p><div id="read-content"></div><a id="conversation" target="_blank" rel="noopener noreferrer" hidden>Obrir conversa ↗</a><p id="reader-message" role="status" aria-live="polite"></p><button id="toggle" type="button">Marcar com a revisada</button></dialog><dialog id="capture"><button id="capture-close" type="button">Tancar</button><h2>Afegir contingut</h2><p>Opció manual: enganxa un text o un bloc JSON. També pots desar contingut directament des de ChatGPT.</p><form id="capture-form"><label for="capture-input">Contingut de ChatGPT</label><textarea id="capture-input" rows="10" maxlength="120000" required></textarea><button id="capture-preview" type="button">Preparar</button><section id="capture-review" hidden><label for="capture-title">Títol</label><input id="capture-title" maxlength="500" required><label for="capture-description">Descripció (opcional)</label><input id="capture-description" maxlength="2000"><label for="capture-url">Enllaç privat a la conversa (opcional)</label><input id="capture-url" type="url" placeholder="https://chatgpt.com/c/…"><h3>Text que es desarà</h3><pre id="capture-content"></pre><button id="capture-save" type="submit">Desar a la safata</button></section><p id="capture-message" role="status" aria-live="polite"></p></form></dialog></main></body></html>
